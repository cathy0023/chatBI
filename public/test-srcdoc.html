<html>
<body>
<h2>Test: srcdoc iframe with local script</h2>
<iframe sandbox="allow-scripts allow-same-origin" id="test" style="width:600px;height:400px;border:2px solid red;"></iframe>
<script>
const html = '<html><body style="height:100%"><script src="/echarts.min.js"><\/script><div id="chart" style="width:100%;height:300px;"></div><script>document.addEventListener("DOMContentLoaded", function() { var chart = echarts.init(document.getElementById("chart")); chart.setOption({title:{text:"Test"},xAxis:{data:["A","B"]},yAxis:{},series:[{type:"bar",data:[10,20]}]}); });<\/script></body></html>';
document.getElementById('test').srcdoc = html;
</script>
</body>
</html>
